name: Build Glaze (macOS VST3 + AU)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: brew install ninja || true

      - name: "Configure (universal: Apple Silicon + Intel)"
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build Glaze
        run: cmake --build build --config Release --target Glaze_VST3 Glaze_AU Glaze_Standalone

      - name: Build Pump (sidechain)
        run: |
          cmake -S pump -B build-pump -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build-pump --config Release --target Pump_VST3 Pump_AU

      - name: Build Liftoff (buildups)
        run: |
          cmake -S liftoff -B build-liftoff -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build-liftoff --config Release --target Liftoff_VST3 Liftoff_AU

      - name: Ad-hoc sign
        run: |
          A=build/Glaze_artefacts/Release
          codesign --force --deep --sign - "$A/VST3/Glaze.vst3"
          codesign --force --deep --sign - "$A/AU/Glaze.component"
          codesign --force --deep --sign - "$A/Standalone/Glaze.app"
          P=build-pump/Pump_artefacts/Release
          codesign --force --deep --sign - "$P/VST3/Pump.vst3"
          codesign --force --deep --sign - "$P/AU/Pump.component"
          F=build-liftoff/Liftoff_artefacts/Release
          codesign --force --deep --sign - "$F/VST3/Liftoff.vst3"
          codesign --force --deep --sign - "$F/AU/Liftoff.component"

      - name: Validate Audio Unit (auval)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/Glaze_artefacts/Release/AU/Glaze.component ~/Library/Audio/Plug-Ins/Components/
          cp -R build-pump/Pump_artefacts/Release/AU/Pump.component ~/Library/Audio/Plug-Ins/Components/
          cp -R build-liftoff/Liftoff_artefacts/Release/AU/Liftoff.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2
          auval -v aufx Glz1 Glzz
          auval -v aufx Pmp1 Glzz
          auval -v aufx Lft1 Glzz

      - name: Package
        run: |
          A=build/Glaze_artefacts/Release
          mkdir -p dist/Glaze
          cp -R "$A/VST3/Glaze.vst3" "$A/AU/Glaze.component" "$A/Standalone/Glaze.app" dist/Glaze/
          P=build-pump/Pump_artefacts/Release
          cp -R "$P/VST3/Pump.vst3" "$P/AU/Pump.component" dist/Glaze/
          cp "packaging/Install Glaze.command" dist/Glaze/
          cp packaging/README.txt dist/Glaze/
          chmod +x "dist/Glaze/Install Glaze.command"
          mkdir -p dist/Pump
          cp -R "$P/VST3/Pump.vst3" "$P/AU/Pump.component" dist/Pump/
          cp "packaging/Install Pump.command" dist/Pump/
          cp packaging/README-Pump.txt dist/Pump/README.txt
          chmod +x "dist/Pump/Install Pump.command"
          F=build-liftoff/Liftoff_artefacts/Release
          mkdir -p dist/Liftoff
          cp -R "$F/VST3/Liftoff.vst3" "$F/AU/Liftoff.component" dist/Liftoff/
          cp "packaging/Install Liftoff.command" dist/Liftoff/
          cp packaging/README-Liftoff.txt dist/Liftoff/README.txt
          chmod +x "dist/Liftoff/Install Liftoff.command"
          cd dist && ditto -c -k --keepParent Glaze Glaze-mac.zip && ditto -c -k --keepParent Pump Pump-mac.zip && ditto -c -k --keepParent Liftoff Liftoff-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Glaze-mac
          path: dist/Glaze-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Pump-mac
          path: dist/Pump-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Liftoff-mac
          path: dist/Liftoff-mac.zip

      - name: Publish release (when a v* tag is pushed)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Glaze-mac.zip
            dist/Pump-mac.zip
            dist/Liftoff-mac.zip
